# vmalert -> Alertmanager -> webhook wakes the LangGraph SRE agent (event-driven; no polling).
global:
  resolve_timeout: 5m

route:
  receiver: sre-agent-webhook
  group_by: [alertname, service_name]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: sre-agent-webhook
    webhook_configs:
      - url: http://sre-agent:8080/webhook/vmalert
        send_resolved: true
        http_config:
          follow_redirects: true
