# LTOV stack: Loki, Tempo, OpenTelemetry Collector, VictoriaMetrics (+ vmalert).
# Victim Service exports OTLP only to the collector — never directly to backends.

name: agentic-sre-ltov

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=7d"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    volumes:
      - vm-data:/storage
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "8428:8428"
    networks: [ltov]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [ltov]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [ltov]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - victoria-metrics
      - tempo
      - loki
    networks: [ltov]

  vmalert:
    image: victoriametrics/vmalert:v1.106.1
    command:
      - "-rule=/etc/vmalert/rules/*.yml"
      - "-datasource.url=http://victoria-metrics:8428"
      - "-notifier.url=http://alertmanager:9093"
      - "-external.url=http://localhost:8880"
      - "-evaluationInterval=30s"
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    ports:
      - "8880:8880"
    depends_on:
      - victoria-metrics
      - alertmanager
    networks: [ltov]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks: [ltov]

  express-victim-service:
    build:
      context: ../victim-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: express-victim-service
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - otel-collector
    networks: [ltov]

networks:
  ltov:
    driver: bridge

volumes:
  vm-data:
  tempo-data:
  loki-data:
